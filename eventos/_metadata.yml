# =============================================================
# Valores padrão para todas as páginas da pasta eventos/.
# A classe abaixo esconde a data do topo da página: ela já aparece,
# mais completa (com o horário), na ficha gerada por {{< ficha >}}.
# =============================================================
body-classes: pagina-evento
# Ao fim da página: seção "Área mapeada" (se houver area.geojson) e seção "Parceiros" (se houver parceiros no cabeçalho)
filters:
  - mapa
  - parceiros
