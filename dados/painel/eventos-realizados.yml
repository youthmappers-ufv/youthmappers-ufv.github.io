- title: Mapatona Angra dos Reis
  path: ../../eventos/2022-07-09-mapatona-angra/index.qmd
  date: 2022-07-09
  description: O projeto foi criado para priorizar o mapeamento de feições em
    áreas de risco geológico, considerando os frequentes desastres ocorridos
    nesta região do estado do Rio de Janeiro, como os deslizamentos que
    aconteceram em Angra dos Reis em abril de 2022, com maior atenção ao bairro
    Monsuaba, que foi o mais atingido e que vitimou, fatalmente, 11 pessoas.
