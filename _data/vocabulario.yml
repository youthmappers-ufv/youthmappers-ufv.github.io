# =============================================================
# Vocabulário controlado do site: os ÚNICOS valores aceitos nos
# campos estruturados dos membros, eventos, projetos e publicações.
#
# O script scripts/gerar-dados.ts confere cada arquivo contra esta
# lista e avisa quando encontra um valor desconhecido.
# Os códigos (à esquerda) são gravados nos arquivos; os nomes (à
# direita) são o que aparece no site e no painel.
# =============================================================

